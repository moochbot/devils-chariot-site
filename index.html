<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Devil's Chariot</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#0a0a0a;color:#d4d4d4;
  font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:48rem;margin:0 auto;padding:4rem 1.5rem 6rem}
nav{display:flex;gap:1.5rem;font-size:.8rem;margin-bottom:3rem}
nav a{color:#737373;text-decoration:none}
nav a:hover{color:#d4d4d4}
h1{font-size:1.875rem;font-weight:700;letter-spacing:-.02em;color:#fff;margin:0 0 1.5rem}
h2{font-size:1.25rem;font-weight:600;color:#fff;margin:2.5rem 0 .75rem}
h3{font-size:1rem;font-weight:600;color:#fff;margin:1.5rem 0 .5rem}
p,ul,ol{margin:1rem 0}
ul,ol{padding-left:1.5rem}
li{margin:.25rem 0}
strong{color:#fff;font-weight:600}
a{color:#f97316;text-decoration:underline;text-underline-offset:2px}
a:hover{color:#fff}
hr{border:0;border-top:1px solid rgba(255,255,255,.1);margin:2.5rem 0}
code{background:rgba(255,255,255,.06);padding:.1rem .35rem;border-radius:.25rem;
  font-size:.875em;color:#e5e5e5}
blockquote{margin:1rem 0;padding-left:1rem;border-left:2px solid rgba(255,255,255,.15);color:#a3a3a3}
.tablewrap{overflow-x:auto;margin:1.5rem 0}
table{width:100%;border-collapse:collapse;font-size:.875rem}
th{text-align:left;font-weight:600;color:#fff;padding:.5rem .75rem;
  border-bottom:1px solid rgba(255,255,255,.15)}
td{padding:.5rem .75rem;vertical-align:top;border-bottom:1px solid rgba(255,255,255,.06)}
footer{margin-top:4rem;padding-top:2rem;border-top:1px solid rgba(255,255,255,.08);
  font-size:.8rem;color:#737373}
</style>
</head>
<body>
<div class="wrap">
<h1>Devil's Chariot</h1>
<p>A personal flight logbook for iPhone. Your flight history stays on your
device — the app has no account system, no server, and no analytics.</p>
<ul>
<li><a href="./privacy/">Privacy Policy</a></li>
<li><a href="./support/">Support</a></li>
</ul>
</div>
</body>
</html>
